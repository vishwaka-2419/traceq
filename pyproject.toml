[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "traceq-provisioning"
version = "0.3.0"
description = "Trace-aware finite-buffer magic-state provisioning: simulators, closed forms and study scripts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.59", "matplotlib>=3.7"]
[project.optional-dependencies]
test = ["pytest>=7"]
publishing = ["pymupdf>=1.24"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
